[package]
name = "og-server"
version = "0.1.0"
description = "Self-hosted web backend for Open Grind: serves the SvelteKit UI and replaces the Tauri IPC with HTTP and WebSocket"
license = "MIT"
edition = "2021"
publish = false

[dependencies]
# Same Grindr client and HTTP stack as the Tauri app (src-tauri/Cargo.toml)
grindr = "0.34"

argon2 = { version = "0.5", features = ["std"] }
# Enables argon2's `password_hash::rand_core::OsRng` (salt generation)
rand_core = { version = "0.6", features = ["getrandom"] }
axum = { version = "0.8", features = ["ws", "form"] }
base64 = "0.22"
getrandom = "0.3"
# Same versions/features as src-tauri: upstream photo/ and video/ modules are
# compiled here unchanged (see #[path] modules in main.rs).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
moxcms = "0.8"
uuid = { version = "1", features = ["v4"] }
rmp-serde = "1.3.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "fs", "io-std", "io-util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = "symbols"

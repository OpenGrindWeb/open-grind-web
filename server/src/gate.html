<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Open Grind">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/og-icons/apple-touch-icon.png">
<meta name="color-scheme" content="light dark">
<title>Open Grind</title>
<style>
	:root { --bg: #f6f6f6; --fg: #111; --card: #fff; --muted: #666; --accent: #f5b301; --err: #c0392b; }
	@media (prefers-color-scheme: dark) { :root { --bg: #0d0d0d; --fg: #eee; --card: #1a1a1a; --muted: #999; } }
	* { box-sizing: border-box; }
	body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
		font: 16px/1.4 -apple-system, system-ui, sans-serif; padding: 16px; }
	form { width: 100%; max-width: 340px; background: var(--card); padding: 24px; border-radius: 16px; display: grid; gap: 12px; }
	h1 { margin: 0 0 4px; font-size: 20px; }
	input, button { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid #8884; width: 100%; }
	input { background: transparent; color: inherit; }
	button { background: var(--accent); color: #111; border: 0; font-weight: 600; }
	.msg { font-size: 14px; color: var(--err); min-height: 1em; margin: 0; }
	#field[inputmode="numeric"] { font-size: 22px; letter-spacing: 0.3em; text-align: center; }
	button.link { background: none; color: var(--muted); padding: 4px; font-weight: 500; font-size: 14px; }
</style>
</head>
<body data-modes="{{MODES}}">
<form method="post" action="/gate/login">
	<h1>Open Grind</h1>
	<input id="field" name="password" required autofocus>
	<button type="submit">Entrer</button>
	<button type="button" id="switch" class="link" hidden></button>
	<p class="msg" id="msg"></p>
</form>
<script>
	// "code": authenticator code only; "password": password only; "both".
	const modes = document.body.dataset.modes;
	const field = document.getElementById("field");
	const switcher = document.getElementById("switch");
	let usingCode = modes !== "password";

	function show() {
		if (usingCode) {
			field.type = "text";
			field.inputMode = "numeric";
			field.autocomplete = "one-time-code";
			field.pattern = "[0-9 ]{6,7}";
			field.maxLength = 7;
			field.placeholder = "Code à 6 chiffres";
			switcher.textContent = "Utiliser le mot de passe";
		} else {
			field.type = "password";
			field.inputMode = "text";
			field.autocomplete = "current-password";
			field.removeAttribute("pattern");
			field.removeAttribute("maxlength");
			field.placeholder = "Mot de passe du serveur";
			switcher.textContent = "Utiliser un code";
		}
		switcher.hidden = modes !== "both";
	}
	switcher.addEventListener("click", () => {
		usingCode = !usingCode;
		field.value = "";
		show();
		field.focus();
	});
	show();

	const q = new URLSearchParams(location.search);
	const msg = document.getElementById("msg");
	if (q.has("locked")) msg.textContent = "Trop d'essais. Réessaie dans 15 minutes.";
	else if (q.has("paused")) msg.textContent = "Trop de codes faux cette heure-ci : utilise le mot de passe ou réessaie plus tard.";
	else if (q.has("failed")) msg.textContent = usingCode ? "Code incorrect ou déjà utilisé." : "Mot de passe incorrect.";
</script>
</body>
</html>

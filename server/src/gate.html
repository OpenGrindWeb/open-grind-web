<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<title>Open Grind</title>
<style>
	:root { --bg: #f6f6f6; --fg: #111; --card: #fff; --muted: #666; --accent: #f5b301; --err: #c0392b; }
	@media (prefers-color-scheme: dark) { :root { --bg: #0d0d0d; --fg: #eee; --card: #1a1a1a; --muted: #999; } }
	* { box-sizing: border-box; }
	body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
		font: 16px/1.4 -apple-system, system-ui, sans-serif; padding: 16px; }
	form { width: 100%; max-width: 340px; background: var(--card); padding: 24px; border-radius: 16px; display: grid; gap: 12px; }
	h1 { margin: 0 0 4px; font-size: 20px; }
	input, button { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid #8884; width: 100%; }
	input { background: transparent; color: inherit; }
	button { background: var(--accent); color: #111; border: 0; font-weight: 600; }
	.msg { font-size: 14px; color: var(--err); min-height: 1em; margin: 0; }
</style>
</head>
<body>
<form method="post" action="/gate/login">
	<h1>Open Grind</h1>
	<input type="password" name="password" autocomplete="current-password" placeholder="Mot de passe du serveur" required autofocus>
	<button type="submit">Entrer</button>
	<p class="msg" id="msg"></p>
</form>
<script>
	const q = new URLSearchParams(location.search);
	const msg = document.getElementById("msg");
	if (q.has("locked")) msg.textContent = "Trop d'essais. Réessaie dans 15 minutes.";
	else if (q.has("failed")) msg.textContent = "Mot de passe incorrect.";
</script>
</body>
</html>
